    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" fill="url(#bgA)"/>
  <circle cx="125" cy="175" r="130" fill="url(#glowA)"/>

  <!-- decorative arcs -->
  <g stroke="#b89a5a" stroke-width="0.5" fill="none" opacity="0.55">
