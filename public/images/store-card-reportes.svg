<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1734"/>
      <stop offset="1" stop-color="#1c1538"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4b3a7a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4b3a7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="250" height="350" fill="url(#bgR)"/>
  <circle cx="125" cy="175" r="140" fill="url(#glowR)"/>

  <!-- decorative arcs -->
  <g stroke="#d4b26b" stroke-width="0.5" fill="none" opacity="0.6">
    <circle cx="125" cy="175" r="92"/>
    <circle cx="125" cy="175" r="72" stroke-dasharray="1 4"/>
    <circle cx="125" cy="175" r="56" stroke-dasharray="2 6"/>
  </g>

  <!-- crosshair -->
  <g stroke="#d4b26b" stroke-width="0.4" opacity="0.55">
    <line x1="10" y1="175" x2="30" y2="175"/>
    <line x1="220" y1="175" x2="240" y2="175"/>
    <line x1="125" y1="35" x2="125" y2="55"/>
    <line x1="125" y1="295" x2="125" y2="315"/>
  </g>
  <g fill="#d4b26b" opacity="0.75">
    <circle cx="33" cy="175" r="1.3"/>
    <circle cx="217" cy="175" r="1.3"/>
    <circle cx="125" cy="58" r="1.3"/>
    <circle cx="125" cy="292" r="1.3"/>
  </g>

  <!-- central: document with chart lines -->
  <g transform="translate(125,175)" stroke="#e5c58a" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -24 -36 L 18 -36 L 30 -24 L 30 36 L -24 36 Z"/>
    <path d="M 18 -36 L 18 -24 L 30 -24"/>
    <path d="M -16 -14 L 22 -14"/>
    <path d="M -16 -4 L 22 -4"/>
    <!-- chart -->
    <path d="M -16 20 L -8 10 L 0 16 L 8 6 L 16 12 L 22 4" stroke="#f0d79c" stroke-width="1.2"/>
    <g fill="#f0d79c" stroke="none">
      <circle cx="-16" cy="20" r="1.4"/>
      <circle cx="-8" cy="10" r="1.4"/>
      <circle cx="0" cy="16" r="1.4"/>
      <circle cx="8" cy="6" r="1.4"/>
      <circle cx="16" cy="12" r="1.4"/>
      <circle cx="22" cy="4" r="1.4"/>
    </g>
  </g>

  <!-- stars -->
  <g fill="#d4b26b">
    <g opacity="0.85">
      <path d="M 40 60 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
      <path d="M 205 100 l 1.2 -3 l 1.2 3 l 3 1.2 l -3 1.2 l -1.2 3 l -1.2 -3 l -3 -1.2 z"/>
      <path d="M 212 265 l 1.5 -4 l 1.5 4 l 4 1.5 l -4 1.5 l -1.5 4 l -1.5 -4 l -4 -1.5 z"/>
      <path d="M 32 290 l 1.2 -3 l 1.2 3 l 3 1.2 l -3 1.2 l -1.2 3 l -1.2 -3 l -3 -1.2 z"/>
    </g>
    <g opacity="0.65">
      <circle cx="65" cy="105" r="1"/>
      <circle cx="195" cy="52" r="0.9"/>
      <circle cx="45" cy="235" r="0.9"/>
      <circle cx="200" cy="320" r="1"/>
      <circle cx="80" cy="310" r="0.8"/>
      <circle cx="180" cy="245" r="0.8"/>
      <circle cx="150" cy="35" r="0.8"/>
      <circle cx="95" cy="40" r="0.8"/>
    </g>
  </g>

  <!-- crescent moon upper right -->
  <path d="M 215 45 a 10 10 0 1 0 6 18 a 8 8 0 1 1 -6 -18 z" fill="#d4b26b" opacity="0.55"/>
</svg>
